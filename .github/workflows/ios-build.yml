name: Compilar y Capturar Pantalla iOS

on:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar pruebas y generar capturas
        run: |
          set -o pipefail
          xcodebuild test \
            -project "Reto 3 - Sabias Que.xcodeproj" \
            -scheme "Reto 3 - Sabias Que" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO || true

      - name: Comprimir resultados visuales
        run: |
          zip -r TestScreenshots.zip TestResults.xcresult || true

      - name: Subir artefacto de capturas
        uses: actions/upload-artifact@v4
        with:
          name: Capturas-Simulador-Final
          path: TestScreenshots.zip
