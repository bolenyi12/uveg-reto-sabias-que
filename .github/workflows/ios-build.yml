name: Compilar y Capturar Pantalla iOS

on:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Simulador y capturar pantalla
        run: |
          xcodebuild test \
            -project "Reto 3 - Sabias Que.xcodeproj" \
            -scheme "Reto 3 - Sabias Que" \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Guardar resultados y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Capturas-Simulador
          path: TestResults.xcresult
