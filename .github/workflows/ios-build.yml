name: Capturar Pantalla iOS Directa

on:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Compilar la aplicacion para simulador
        run: |
          xcodebuild -project "Reto 3 - Sabias Que.xcodeproj" \
            -scheme "Reto 3 - Sabias Que" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Iniciar Simulador y tomar captura
        run: |
          # Iniciar un simulador de iPhone disponible en segundo plano
          DEVICE_ID=$(xcrun simctl create "TestiPhone" com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-0 || true)
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available iPhone | grep -m 1 -oE '[0-9A-F-]{36}')
          fi

          echo "Usando dispositivo: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true

          # Instalar y lanzar la app compilada
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -name "*.app" | head -n 1)
          echo "Ruta de la app: $APP_PATH"

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          BUNDLE_ID=$(defaults read "$APP_PATH/Info.plist" CFBundleIdentifier)

          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 3 # Esperar a que cargue la interfaz

          # Tomar la captura de pantalla directamente
          mkdir -p output_screenshots
          xcrun simctl io "$DEVICE_ID" screenshot output_screenshots/captura_app.png

      - name: Subir imagen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Captura-Real-Pantalla
          path: output_screenshots/captura_app.png
