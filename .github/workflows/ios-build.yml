name: Compilar y Capturar Pantalla iOS

on:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Listar simuladores disponibles y ejecutar prueba
        run: |
          SIM_ID=$(xcrun simctl list devices available iPhone | grep -m 1 -oE '[0-9A-F-]{36}')
          echo "Usando simulador ID: $SIM_ID"
          xcodebuild test \
            -project "Reto 3 - Sabias Que.xcodeproj" \
            -scheme "Reto 3 - Sabias Que" \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Guardar resultados y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Capturas-Simulador
          path: TestResults.xcresult
